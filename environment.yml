name: minal
channels:
  - conda-forge
dependencies:
  - python=3.12

  # uv is the sole dependency manager for the app (see docs/TECH_STACK.md).
  # App dependencies (LiteLLM client, LangChain, Docling, ChromaDB,
  # sentence-transformers, Langfuse) are declared in pyproject.toml and
  # pinned in uv.lock, not here.
  # vLLM is NOT part of this env: it lives in its own conda env, `minal-vllm`
  # (configs/vllm-env.yml), because it conflicts with Docling/torch.
  - uv
  - pip
