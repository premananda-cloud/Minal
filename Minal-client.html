<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minal — NIELIT Imphal Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ---- Tokens ---------------------------------------------------- */
  :root {
    --graphite:        #21242A;   /* panel base */
    --graphite-raised:  #2A2E36;  /* cards / raised surfaces */
    --graphite-line:    #383D48;  /* dividers, borders */
    --bone:             #EDE8DC; /* primary text, warm */
    --muted:            #8A8F9C; /* labels, secondary text, cool */
    --amber:            #E8A33D; /* primary indicator / accent */
    --amber-dim:        #6B4E22;
    --teal:             #4FA893; /* secondary indicator */
    --teal-dim:         #2C4B44;
    --fault:            #D65A4A; /* error only */
    --fault-dim:        #5C3430;

    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body:    'IBM Plex Sans', system-ui, sans-serif;
    --font-mono:    'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--graphite);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(232,163,61,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(79,168,147,0.05), transparent 40%);
    color: var(--bone);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .panel { animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---- Panel shell ------------------------------------------------ */
  .panel {
    width: 100%;
    max-width: 660px;
    height: 88vh;
    max-height: 840px;
    background: var(--graphite-raised);
    border: 1px solid var(--graphite-line);
    border-radius: 14px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
  }

  /* ---- Header ------------------------------------------------------ */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding-bottom: 16px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--graphite-line);
  }
  .brand h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .brand .tag {
    margin: 3px 0 0;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .header-controls {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
  }
  .led {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    box-shadow: 0 0 0 rgba(232,163,61,0);
    flex-shrink: 0;
  }
  .led.ready   { background: var(--amber); animation: breathe 2.6s ease-in-out infinite; }
  .led.thinking{ background: var(--teal);  animation: breathe 0.8s ease-in-out infinite; }
  .led.fault   { background: var(--fault); }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 2px 0 currentColor; opacity: 0.55; }
    50%      { box-shadow: 0 0 8px 1px currentColor; opacity: 1; }
  }
  .led.ready { color: var(--amber); }
  .led.thinking { color: var(--teal); }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--graphite-line);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 6px 11px;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s, color 0.15s;
  }
  .reset-btn:hover {
    border-color: var(--amber);
    color: var(--bone);
  }

  /* ---- Category chips (signature element) -------------------------- */
  .chips {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    margin-bottom: 14px;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--graphite);
    border: 1px solid var(--graphite-line);
    border-radius: 8px;
    padding: 8px 8px;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--muted);
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .chip:hover {
    border-color: var(--graphite-line);
    color: var(--bone);
  }
  .chip .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--graphite-line);
    flex-shrink: 0;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .chip.active {
    border-color: var(--amber-dim);
    color: var(--bone);
    background: rgba(232,163,61,0.07);
  }
  .chip.active .dot {
    background: var(--amber);
    box-shadow: 0 0 6px 1px rgba(232,163,61,0.7);
  }

  /* ---- Settings ------------------------------------------------------ */
  details.settings { margin-bottom: 12px; }
  details.settings summary {
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
  }
  .api-row { display: flex; gap: 8px; margin-top: 8px; }
  .api-row input {
    flex: 1;
    background: var(--graphite);
    border: 1px solid var(--graphite-line);
    color: var(--muted);
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 7px;
    font-family: var(--font-mono);
  }
  .api-row input:focus { outline: none; border-color: var(--amber-dim); }

  /* ---- Messages -------------------------------------------------- */
  .messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 4px 2px 12px;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: var(--graphite-line); border-radius: 3px; }

  .msg-row { display: flex; flex-direction: column; max-width: 84%; }
  .msg-row.user { align-self: flex-end; align-items: flex-end; }
  .msg-row.assistant, .msg-row.error { align-self: flex-start; align-items: flex-start; }

  .msg {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    background: var(--amber-dim);
    color: var(--bone);
    border-bottom-right-radius: 3px;
  }
  .msg.assistant {
    background: var(--graphite);
    border: 1px solid var(--graphite-line);
    border-bottom-left-radius: 3px;
  }
  .msg.error {
    background: transparent;
    border: 1px solid var(--fault-dim);
    color: var(--fault);
    border-bottom-left-radius: 3px;
  }
  .msg.thinking {
    background: var(--graphite);
    border: 1px solid var(--graphite-line);
    color: var(--muted);
  }

  .source-tag {
    margin-top: 4px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--teal);
    padding-left: 3px;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.6;
    padding: 20px;
  }

  /* ---- Input row -------------------------------------------------- */
  form {
    display: flex;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px solid var(--graphite-line);
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--graphite);
    border: 1px solid var(--graphite-line);
    color: var(--bone);
    border-radius: 9px;
    padding: 13px 14px;
    font-size: 15px;
    font-family: var(--font-body);
    min-height: 48px;
    max-height: 140px;
    line-height: 1.4;
  }
  textarea:focus { outline: none; border-color: var(--amber-dim); }

  button.send {
    background: var(--amber);
    color: #241505;
    border: none;
    border-radius: 9px;
    padding: 0 24px;
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
  }
  button.send:hover:not(:disabled) { background: #f0b158; }
  button.send:active:not(:disabled) { transform: scale(0.98); }
  button.send:disabled {
    background: var(--amber-dim);
    color: rgba(237,232,220,0.5);
    cursor: not-allowed;
  }

  .dot-loader {
    display: inline-flex;
    gap: 4px;
  }
  .dot-loader span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--muted);
    animation: pulse 1s infinite ease-in-out;
  }
  .dot-loader span:nth-child(2) { animation-delay: 0.15s; }
  .dot-loader span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

  @media (max-width: 480px) {
    .panel { padding: 16px; height: 92vh; }
    .chips { grid-template-columns: repeat(2, 1fr); }
    .brand h1 { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="panel">
  <div class="header">
    <div class="brand">
      <h1>MINAL</h1>
      <p class="tag">NIELIT Imphal &middot; Campus Assistant</p>
    </div>
    <div class="header-controls">
      <div class="status">
        <span class="led ready" id="statusLed"></span>
        <span id="statusLabel">Checking&hellip;</span>
      </div>
      <button class="reset-btn" id="newChatBtn" type="button">New chat</button>
    </div>
  </div>

  <div class="chips" id="chips">
    <button class="chip" type="button" data-category="faculty" data-starter="Who teaches ">
      <span class="dot"></span>Faculty
    </button>
    <button class="chip" type="button" data-category="courses" data-starter="Tell me about the course ">
      <span class="dot"></span>Courses
    </button>
    <button class="chip" type="button" data-category="labs" data-starter="What labs cover ">
      <span class="dot"></span>Labs
    </button>
    <button class="chip" type="button" data-category="notices" data-starter="Are there any notices about ">
      <span class="dot"></span>Notices
    </button>
  </div>

  <details class="settings">
    <summary>API settings</summary>
    <div class="api-row">
      <input id="apiUrl" type="text" value="http://127.0.0.1:8000" spellcheck="false">
    </div>
  </details>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">Tap a category above, or type your own question about faculty, courses, labs, or notices at NIELIT Imphal.</div>
  </div>

  <form id="askForm">
    <textarea id="query" placeholder="Ask a question&hellip;" required rows="1"></textarea>
    <button class="send" type="submit" id="submitBtn">Ask</button>
  </form>
</div>

<script>
  const form = document.getElementById('askForm');
  const queryEl = document.getElementById('query');
  const apiUrlEl = document.getElementById('apiUrl');
  const submitBtn = document.getElementById('submitBtn');
  const messagesEl = document.getElementById('messages');
  const newChatBtn = document.getElementById('newChatBtn');
  const statusLed = document.getElementById('statusLed');
  const statusLabel = document.getElementById('statusLabel');
  const chips = document.querySelectorAll('.chip');

  let sessionId = null; // set by the server on first reply, then reused for the conversation

  // Maps a "tool_name:query" source string to a category + a plain-language label.
  const CATEGORY_MAP = [
    { match: 'faculty', category: 'faculty', label: 'Faculty directory' },
    { match: 'course',  category: 'courses', label: 'Course catalog' },
    { match: 'lab',     category: 'labs',    label: 'Lab directory' },
    { match: 'notice',  category: 'notices', label: 'Notices board' },
  ];

  function baseUrl() {
    return apiUrlEl.value.trim().replace(/\/+$/, '');
  }

  function addMessage(role, text) {
    const empty = document.getElementById('emptyState');
    if (empty) empty.remove();
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;
    const bubble = document.createElement('div');
    bubble.className = `msg ${role}`;
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function addSourceCaptions(row, sources) {
    if (!sources || !sources.length) return;
    const seen = new Set();
    sources.forEach(src => {
      const toolName = String(src).split(':')[0].toLowerCase();
      const match = CATEGORY_MAP.find(c => toolName.includes(c.match));
      const label = match ? match.label : toolName;
      if (seen.has(label)) return;
      seen.add(label);
      const cap = document.createElement('div');
      cap.className = 'source-tag';
      cap.textContent = `via ${label}`;
      row.appendChild(cap);
      if (match) flashChip(match.category);
    });
  }

  function flashChip(category) {
    const chip = document.querySelector(`.chip[data-category="${category}"]`);
    if (!chip) return;
    chip.classList.add('active');
    clearTimeout(chip._flashTimer);
    chip._flashTimer = setTimeout(() => chip.classList.remove('active'), 2200);
  }

  function addThinkingBubble() {
    const empty = document.getElementById('emptyState');
    if (empty) empty.remove();
    const row = document.createElement('div');
    row.className = 'msg-row assistant';
    const bubble = document.createElement('div');
    bubble.className = 'msg thinking';
    bubble.innerHTML = '<span class="dot-loader"><span></span><span></span><span></span></span>';
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function setStatus(state) {
    // state: 'ready' | 'thinking' | 'offline' | 'fault'
    statusLed.classList.remove('ready', 'thinking', 'fault');
    if (state === 'ready') {
      statusLed.classList.add('ready');
      statusLabel.textContent = 'Online';
    } else if (state === 'thinking') {
      statusLed.classList.add('thinking');
      statusLabel.textContent = 'Thinking';
    } else if (state === 'offline') {
      statusLed.classList.add('fault');
      statusLabel.textContent = 'Offline';
    } else {
      statusLed.classList.add('fault');
      statusLabel.textContent = 'Error';
    }
  }

  async function checkHealth() {
    try {
      const res = await fetch(`${baseUrl()}/health`, { method: 'GET' });
      if (!res.ok) throw new Error('bad status');
      setStatus('ready');
    } catch (_) {
      setStatus('offline');
    }
  }

  function resetConversation() {
    const oldSessionId = sessionId;
    sessionId = null;
    messagesEl.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.id = 'emptyState';
    empty.textContent = 'Tap a category above, or type your own question about faculty, courses, labs, or notices at NIELIT Imphal.';
    messagesEl.appendChild(empty);

    // best-effort server-side cleanup; ignore failures (e.g. server already gone)
    if (oldSessionId) {
      fetch(`${baseUrl()}/session/${oldSessionId}/reset`, { method: 'POST' }).catch(() => {});
    }
  }

  newChatBtn.addEventListener('click', resetConversation);

  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      const starter = chip.dataset.starter || '';
      queryEl.value = starter;
      queryEl.focus();
      queryEl.style.height = 'auto';
      queryEl.style.height = Math.min(queryEl.scrollHeight, 140) + 'px';
      queryEl.setSelectionRange(queryEl.value.length, queryEl.value.length);
    });
  });

  // auto-grow textarea, Enter submits, Shift+Enter newline
  queryEl.addEventListener('input', () => {
    queryEl.style.height = 'auto';
    queryEl.style.height = Math.min(queryEl.scrollHeight, 140) + 'px';
  });
  queryEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const query = queryEl.value.trim();
    if (!query) return;

    addMessage('user', query);
    queryEl.value = '';
    queryEl.style.height = 'auto';

    submitBtn.disabled = true;
    setStatus('thinking');
    const thinkingRow = addThinkingBubble();

    try {
      const res = await fetch(`${baseUrl()}/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, session_id: sessionId })
      });

      if (!res.ok) {
        let detail = res.statusText;
        try {
          const errBody = await res.json();
          detail = errBody.detail || detail;
        } catch (_) {}
        throw new Error(`${res.status}: ${detail}`);
      }

      const data = await res.json();
      sessionId = data.session_id || sessionId;

      thinkingRow.remove();
      const row = addMessage('assistant', data.answer || '(empty response)');
      addSourceCaptions(row, data.sources);
      setStatus('ready');
    } catch (err) {
      thinkingRow.remove();
      addMessage('error', `Minal can't reach the server. Check the connection and try again. (${err.message})`);
      setStatus('offline');
    } finally {
      submitBtn.disabled = false;
      queryEl.focus();
    }
  });

  checkHealth();
  setInterval(checkHealth, 25000);
</script>

</body>
</html>
